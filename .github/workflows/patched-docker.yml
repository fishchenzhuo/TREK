name: Build patched image

# 构建带共享空间补丁的镜像,推到 ghcr.io。push 到 patched 分支或手动触发。
# 只构建 linux/amd64 (NAS 是 x86_64)。

on:
  push:
    branches: [patched]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/fishchenzhuo/trek-patched:5.1.2-sharedspace.2
          cache-from: type=gha
          cache-to: type=gha,mode=max
